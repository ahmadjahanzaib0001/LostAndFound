<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/polish.css">
</head>
<body class="theme-admin">

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i data-logo></i><span class="logo-text"><small>Campus</small>Lost &amp; Found</span></div>

        <div class="sidebar-user">
            <img src="../../assets/img/avatar-admin.svg" alt="">
            <div><strong></strong><span>Administrator</span></div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-link"><i data-icon="home"></i><span>Dashboard</span></a>
            <a href="manage-items.html" class="nav-link"><i data-icon="box"></i><span>Manage Items</span></a>
            <a href="manage-users.html" class="nav-link active"><i data-icon="users"></i><span>Manage Users</span></a>
            <a href="claims.html" class="nav-link"><i data-icon="shield-check"></i><span>Claims</span></a>
            <a href="reports.html" class="nav-link"><i data-icon="chart"></i><span>Reports</span></a>
            <a href="settings.html" class="nav-link"><i data-icon="settings"></i><span>Settings</span></a>
        </nav>

        <div class="sidebar-bottom">
            <button type="button" class="nav-link" data-logout><i data-icon="logout"></i><span>Log out</span></button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="dashboard-main">

        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu"><i data-icon="menu"></i></button>
            </div>
            <div class="user-profile">
                <img src="../../assets/img/avatar-admin.svg" alt="">
                <div class="user-info">
                    <span class="user-name"></span>
                    <span class="user-role">Administrator</span>
                </div>
                <i data-icon="chevron-down"></i>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="page-header-row">
                <h1>Manage Users</h1>
                <button class="btn btn-purple btn-sm" id="addUserBtn">Add User</button>
            </div>

            <div class="toolbar" style="display:flex;gap:12px;flex-wrap:wrap"><div class="search-box" style="flex:1;min-width:220px"><i data-icon="search"></i><input type="text" id="userSearch" placeholder="Search users..."></div><select class="form-control" id="userRoleFilter" style="width:160px"><option value="">All roles</option><option value="admin">Admins</option><option value="user">Users</option></select><select class="form-control" id="userStatusFilter" style="width:160px"><option value="">All statuses</option><option value="Active">Active</option><option value="Inactive">Suspended</option></select></div>

            <div class="table-card"><div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div></div>
        </section>

    </main>
</div>

<script src="../../js/icons.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/admin.js"></script>
<script src="../../js/motion.js"></script>
</body>
</html>
