<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Reports - Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/polish.css">
</head>
<body class="theme-user">

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i data-logo></i><span class="logo-text"><small>Campus</small>Lost &amp; Found</span></div>

        <nav class="sidebar-nav" aria-label="Main">
            <a href="dashboard.html" class="nav-link"><i data-icon="home"></i><span>Dashboard</span></a>
            <p class="nav-section">Report</p>
            <a href="report-lost.html" class="nav-link"><i data-icon="file-plus"></i><span>Report Lost</span></a>
            <a href="report-found.html" class="nav-link"><i data-icon="search-check"></i><span>Report Found</span></a>
            <p class="nav-section">Find</p>
            <a href="browse-found.html" class="nav-link"><i data-icon="search"></i><span>Browse Found</span></a>
            <p class="nav-section">My activity</p>
            <a href="my-lost-items.html" class="nav-link"><i data-icon="list"></i><span>Lost Reports</span></a>
            <a href="my-found-items.html" class="nav-link active"><i data-icon="box"></i><span>Found Reports</span></a>
            <a href="claims.html" class="nav-link"><i data-icon="shield-check"></i><span>My Claims</span></a>
            <p class="nav-section">Account</p>
            <a href="profile.html" class="nav-link"><i data-icon="user"></i><span>Profile</span></a>
        </nav>

        <div class="sidebar-bottom">
            <button type="button" class="nav-link" data-logout><i data-icon="logout"></i><span>Log out</span></button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="dashboard-main">

        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu"><i data-icon="menu"></i></button>
            </div>
            <div class="user-profile">
                <img src="../../assets/img/avatar-ahmed.svg" alt="">
                <div class="user-info">
                    <span class="user-name"></span>
                    <span class="user-role">Member</span>
                </div>
                <i data-icon="chevron-down"></i>
            </div>
        </header>

        <section class="dashboard-content">

            <div class="page-header-row">
                <div class="page-header" style="margin:0">
                    <h1>Found Reports</h1>
                    <p>Items you have reported as found.</p>
                </div>
                <a href="report-found.html" class="btn btn-blue">+ Report Found Item</a>
            </div>
            <div class="item-grid" id="foundList"><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w30"></div><div class="sk sk-btn"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w30"></div><div class="sk sk-btn"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w30"></div><div class="sk sk-btn"></div></div><div class="skeleton-card" aria-hidden="true"><div class="sk sk-img"></div><div class="sk sk-line w60"></div><div class="sk sk-line w40"></div><div class="sk sk-line w30"></div><div class="sk sk-btn"></div></div></div>
        </section>

    </main>
</div>

<script src="../../js/icons.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/finder.js"></script>
<script src="../../js/motion.js"></script>
</body>
</html>
